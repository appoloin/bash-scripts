[midi]
mididevice = mt32


[cpu]
cpu_cycles = 24000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off


[autoexec]
mount C -t dir "./" 
imgmount D -t iso -fs iso "./JA1.gog" 

cls 
ECHO OFF
goto launcher

:launcher
cls 
ECHO  -----------------------------------------------------  
ECHO                     Jagged Alliance
ECHO  -----------------------------------------------------  
ECHO   1) Play Game        
ECHO   2) Setup
ECHO  -----------------------------------------------------  
ECHO   3) Exit Program                             
ECHO  -----------------------------------------------------  
choice /c123 /s Which program do you want to run? [1-3]: /n 

if errorlevel 2 goto exit
if errorlevel 2 goto setup
if errorlevel 1 goto game


:game
cls
C:
ja.exe
goto exit


:setup
cls
c:
SETSOUND.EXE
goto launcher


:exit
exit