[midi]
mididevice = mt32


[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[mouse]
mouse_capture = onstart   
mouse_middle_release=true   
mouse_sensitivity= 50

[gus]
gus=true

[sdl]   
fullresolution=desktop
windowresolution=original
fullscreen=true
output=opengl

[render]
aspect=true
scaler=normal2x


[autoexec]
mount c -t dir "./MegaRac2"
imgmount D -t cdrom "./MegaRac2/cd/MegaRace.2-CD1of2.iso" "./MegaRac2/cd/MegaRace.2-CD2of2.iso" 
c:
cd MEGA2
@echo off
cls
@echo.
echo This game has 2 CD's.  Press ctrl-F4 when prompted to switch discs.
echo.
pause
MEGARACE
exit