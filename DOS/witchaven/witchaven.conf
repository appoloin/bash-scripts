[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[dosbox]
machine	= svga_s3
memsize	= 63
vmemsize = 1

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]

mount C "./Enhanced/GAME" -t dir
imgmount D "./witch.iso" -t iso

cls 
ECHO OFF
goto launcher


:launcher
cls 
ECHO  -------------------------------------------  
ECHO                Witchhaven 
ECHO  -------------------------------------------  
ECHO   1) Play        
ECHO   2) Setup                                   
ECHO  -------------------------------------------  
ECHO   3) exit program                             
ECHO  -------------------------------------------  

choice /c123 /s Which program do you want to run? [1-3]: /n 

if errorlevel 3 goto exit   
if errorlevel 2 goto setup
if errorlevel 1 goto game


:game
cls
C:
cd whaven
call whaven.bat
goto exit


:setup
config -securemode
cls
C:
cd whaven
egsetup.exe
goto launcher


:exit
exit