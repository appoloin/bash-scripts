cputype = 486
cpu_throttle = on


[sdl]
fullscreen=true
output=opengl


[render]
viewport = fit
integer_scaling = off


[autoexec]
[midi]
mididevice = fluidsynth


[gus]
gus = true
ultradir = C:\ULTRASND


[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[render]
aspect=true
scaler=normal2x


[autoexec]

mount C "./" -t dir
imgmount D -t cdrom "./cd/CD1.iso" 
imgmount E -t cdrom "./cd/CD2.iso" 
imgmount F -t cdrom "./cd/CD3.iso" 
imgmount G -t cdrom "./cd/CD4.iso" 
imgmount H -t cdrom "./cd/CD5.iso" 
imgmount I -t cdrom "./cd/CD6.iso" 

C:
ECHO OFF
goto launcher

:launcher
cls 
ECHO  -------------------------------------------  
ECHO      Tex Murphy - The Pandora Directive
ECHO  -------------------------------------------  
ECHO   1) Play        
ECHO   2) Setup                                
ECHO  -------------------------------------------  
ECHO   3) Exit                              
ECHO  -------------------------------------------  

choice /c123 /s Which program do you want to run? [1-3]: /n 

if errorlevel 3 goto exit
if errorlevel 2 goto setup
if errorlevel 1 goto game


:game
cls
C:
cd pandora
pandora
goto launcher


:setup
cls
D:
install
goto launcher


:exit
exit