[dosbox]
machine=svga_s3
memsize=63

[midi]
mididevice = mt32


[cpu]
cpu_cycles = 3000
cpu_cycles_protected = auto
cputype = 386
cpu_throttle = on


[mouse]
mouse_capture = onstart   
mouse_middle_release=true   
mouse_sensitivity= 50

[mixer]
prebuffer=20


[sdl]   
fullresolution=desktop
windowresolution=original
fullscreen=true
output=opengl

[render]
aspect=true
scaler=normal2x


[autoexec]
mount c -t dir "./"

c:
som.exe
exit