[midi]
mididevice = mt32


[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off


[autoexec]

mount C -t dir "./" 

cls 
ECHO OFF

c:
cls
ECHO ----------------------------------------------
ECHO - ------------------------------------------ -
ECHO -           Monster Bash Pack                -
ECHO - ------------------------------------------ -
ECHO -  1) Monster Bash Episode 1                 -
ECHO -  2) Monster Bash Episode 2                 -
ECHO -  3) Monster Bash Episode 3                 -
ECHO - ------------------------------------------ -
ECHO -  4) exit program                           -
ECHO - ------------------------------------------ -
ECHO ----------------------------------------------

choice /c1234 /s Which game do you want to run? [1-4]: /n 
if errorlevel 4 goto exit
if errorlevel 3 goto e3
if errorlevel 2 goto e2
if errorlevel 1 goto e1

:e1
@echo off
bash1.exe
exit

:e2
@echo off
bash2.exe
exit

:e3
@echo off
bash3.exe
exit

:exit
exit