[midi]
mididevice = mt32


[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[mouse]
mouse_capture = onstart   
mouse_middle_release=true   
mouse_sensitivity= 50

[gus]
gus=true

[sdl]   
fullresolution=desktop
windowresolution=original
fullscreen=true
output=opengl

[render]
aspect=true
scaler=normal2x


[autoexec]
mount c -t dir "./lemmings"
imgmount a  -t floppy "./lemmings/bonus/Lemmings - The Official Companion - Bonus Disk (1993).img"
imgmount d -t cdrom "./lemmings/CD/AZ_2246.cue" 

c:
cls
call run
exit