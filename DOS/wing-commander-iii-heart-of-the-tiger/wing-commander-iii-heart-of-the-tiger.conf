[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[dosbox]
machine	= svga_s3
memsize	= 63
vmemsize = 1

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]

mount C -t dir "./"
imgmount D "./DATA.DAT" -t iso

D:
cls 
ECHO OFF
goto launcher


:launcher
cls 
ECHO  -------------------------------------------------  
ECHO                Wing Commander III
ECHO  -------------------------------------------------  
ECHO   1) Wing Commander III       
ECHO   2) Setup                               
ECHO  -------------------------------------------------  
ECHO   3) Exit Program                             
ECHO  -------------------------------------------------  


choice /c123 /s Which program do you want to run? [1-3]: /n 

if errorlevel 3 goto exit
if errorlevel 2 goto setup
if errorlevel 1 goto game


:game
cls
cd WC3
wc3.exe
goto exit


:setup
cls
cd WC3
wc3.exe -install
goto launcher

:exit
exit