[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[dosbox]
machine	= svga_s3
memsize	= 63
vmemsize = 1

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]

mount C "./" -t dir
imgmount D "./GAME.GOG" -t iso -fs iso

C:
ECHO off
goto launcher


:launcher
cls

ECHO  ------------------------------------------ 

ECHO            Wing Commander Privateer           

ECHO  ------------------------------------------ 

ECHO   1) Privateer                              

ECHO   2) Privateer - Righteous Fire             

ECHO   3) Setup             

ECHO  ------------------------------------------ 

ECHO   4) Exit Program                           

ECHO  ------------------------------------------


@choice /c1234 /s Which game do you want to run? [1-4]: /n 

if errorlevel 4 goto exit

if errorlevel 3 goto setup

if errorlevel 2 goto rf

if errorlevel 1 goto priv

:priv

cls

priv.exe

goto exit


:rf

cls

priv r

goto exit


:setup

cls

install

goto launcher


:exit
exit