[dosbox]
machine=svga_s3
memsize=63

[midi]
mididevice = mt32


[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[mouse]
mouse_capture = onstart   
mouse_middle_release=true   
mouse_sensitivity= 50

[mixer]
prebuffer=20


[sdl]   
fullresolution=desktop
windowresolution=original
fullscreen=true
output=opengl

[render]
aspect=true
scaler=normal2x


[autoexec]
mount c -t dir "./"

cls 
c:
ECHO OFF
goto launcher

:launcher
cls 
ECHO  -------------------------------------------  
ECHO             Rise of the Dragon 
ECHO  -------------------------------------------  
ECHO   1) Play Game        
ECHO   2) Setup                               
ECHO  -------------------------------------------  
ECHO   3) Exit Program                             
ECHO  -------------------------------------------  

choice /c123 /s Which program do you want to run? [1-3]: /n 

if errorlevel 3 goto exit
if errorlevel 2 goto setup
if errorlevel 1 goto game


:game
cls
dragon
goto exit


:setup
cls
install
goto launcher



:exit
exit