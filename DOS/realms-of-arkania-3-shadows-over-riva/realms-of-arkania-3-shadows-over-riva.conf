[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]

mount C -t dir "./"
imgmount D -t iso -fs iso "./game.ins" 


C:
cls 
ECHO OFF
goto launcher


:launcher
cls 
ECHO  -------------------------------------------------  
ECHO    Reamls of Arkania 3 - Shadows over Riva 
ECHO  -------------------------------------------------  
ECHO   1) Realms of Arkania: Shadows over Riva       
ECHO   2) Realms of Arkania: Shadows over Riva (JEMMEX) 
ECHO   3) Settings                              
ECHO  ---------------------------------------------------  
ECHO   4) Exit Program                             
ECHO  ---------------------------------------------------  

choice /c1234 /s Which program do you want to run? [1-4]: /n 
if errorlevel 4 goto exit
if errorlevel 3 goto setup
if errorlevel 2 goto jemmex
if errorlevel 1 goto game


:game
cls
riva
goto exit


:jemmex
CONFIG -set "xms=false"
CONFIG -set "ems=false"
CONFIG -set "umb=false"
cls
jemmex load noems
RIVA
goto exit


:setup
cd data
cls
setup
cd ..
goto launcher


:exit
exit