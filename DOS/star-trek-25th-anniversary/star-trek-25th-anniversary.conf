[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[midi]
mididevice = mt32

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]
imgmount D "./TREK.cfg" -t iso -fs iso
mount C "./" -t dir

cls 
ECHO OFF
c:
cd TREKCD
goto launcher


:launcher
cls 
ECHO  -------------------------------------------  
ECHO      Star Trek 25th Anniversary Launcher  
ECHO  -------------------------------------------  
ECHO   1) Play        
ECHO   2) Setup                                   
ECHO  -------------------------------------------  
ECHO   3) exit program                             
ECHO  -------------------------------------------  

choice /c123 /s Which program do you want to run? [1-3]: /n 

if errorlevel 3 goto exit
if errorlevel 2 goto setup
if errorlevel 1 goto game


:game
cls
pictview title.jpg
STARTREK
goto exit

:setup
cls
SETUP
goto launcher

:exit
exit