[midi]
mididevice = mt32


[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off


[autoexec]

mount C -t dir "./C" 
imgmount D -t iso -fs iso "./CD/LOLLYPOP.cue" 

SET PATH=Z:\;C:\tools;
C:
run
exit