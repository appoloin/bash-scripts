[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[midi]
mididevice = mt32

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]
mount C  -t dir "./" -freesize 800000
imgmount d  -t cdrom "./VOYEURII/cd/Voyeur2disc1.cue" "./VOYEURII/cd/Voyeur2disc2.cue" 
ECHO OFF
c:
cd VOYEURII
cls
echo.
echo This game spans 2 CDs. Press Ctrl+F4 when prompted to switch to the next disc.
echo.
echo The code to play is 3333
echo.
pause
v2
exit