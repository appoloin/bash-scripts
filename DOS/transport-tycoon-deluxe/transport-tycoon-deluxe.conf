[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[midi]
mididevice = mt32

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]
mount C "./TranTDLX" -t dir
imgmount D "./TranTDLX/cd/Ttdx.iso" -t cdrom

c:
ECHO OFF
cls
call run
exit