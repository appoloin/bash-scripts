[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[dosbox]
machine	= svga_s3
memsize	= 4
vmemsize = 1

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]

mount C -t dir "./"

c:
cls 
ECHO OFF
goto launcher


:launcher
cls 
ECHO  -------------------------------------------------  
ECHO                Wing Commander II
ECHO  -------------------------------------------------  
ECHO   1) Wing Commander II - Vengeance of the Kilrathi      
ECHO   2) Wing Commander II - Special Operations 1   
ECHO   3) Wing Commander II - Special Operations 2                               
ECHO  -------------------------------------------------  
ECHO   4) Exit Program                             
ECHO  -------------------------------------------------  

choice /c1234 /s Which program do you want to run? [1-4]: /n 

if errorlevel 4 goto exit
if errorlevel 3 goto addon2
if errorlevel 2 goto addon1
if errorlevel 1 goto game


:game
cls
loadfix -32 wc2.exe
goto exit


:addons1
cls
loadfix -32 so1.exe
goto launcher


:addons1
cls
loadfix -32 so2.exe
goto launcher


:exit
exit