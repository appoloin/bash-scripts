[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[midi]
mididevice = mt32

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]
@mount c "./XCOMAp"
imgmount d "/XCOMAp/cd/X-COM Apocalypse.iso" -t cdrom

c:
cls
cd XCOMA
XCOMAPOC
exit