[dosbox]
machine=svga_s3
memsize=63

[midi]
mididevice = mt32


[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[mouse]
mouse_capture = onstart   
mouse_middle_release=true   
mouse_sensitivity= 50

[mixer]
prebuffer=20


[sdl]   
fullresolution=desktop
windowresolution=original
fullscreen=true
output=opengl

[render]
aspect=true
scaler=normal2x


[autoexec]

mount c "./psychicd"
imgmount d -t cdrom  "./psychicd/cd/Psychic.Detective.CD1.ISO"  "./psychicd/cd/Psychic.Detective.CD2.ISO"  "./psychicd/cd/Psychic.Detective.CD3.ISO"

c:
cls
echo.
echo This game spans 3 CDs. Press Ctrl+F4 when prompted to switch to the next disc.
echo.
pause
cls
cd psychicd
call PSYCHIC.BAT
exit