[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[midi]
mididevice = mt32

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]

mount C -t dir "./"

C:      
cls 
ECHO OFF
goto launcher


:launcher
cls 
ECHO  -------------------------------------------  
ECHO          Spellcasting Collection  
ECHO  -------------------------------------------  
ECHO   1) Spellcasting 101        
ECHO   2) Spellcastiing 201                                  
ECHO   3) Spellcasting 301                                   
ECHO  -------------------------------------------  
ECHO   4) Exit Program                             
ECHO  -------------------------------------------  

choice /c1234 /s Which program do you want to run? [1-4]: /n 

if errorlevel 4 goto exit
if errorlevel 3 goto 301
if errorlevel 2 goto 201
if errorlevel 1 goto 101


:101
cls
cd 101
S101.EXE mt32
goto exit



:201
cls
cd 201
S201.EXE mt32
goto exit



:301
cls
cd 301
S301.EXE mt32
goto exit


:exit
exit