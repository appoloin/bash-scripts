[dosbox]
machine=svga_s3
memsize=63

[midi]
mididevice = mt32


[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[mouse]
mouse_capture = onstart   
mouse_middle_release=true   
mouse_sensitivity= 50

[mixer]
prebuffer=20


[sdl]   
fullresolution=desktop
windowresolution=original
fullscreen=true
output=opengl

[render]
aspect=true
scaler=normal2x


[autoexec]

mount c "./RedBaron"
imgmount d -t cdrom "./RedBaron/cd/RedBaron.iso" 
imgmount a -t floppy "./RedBaron/cd/Red Baron Expansion Disk.ima" 
c:
cd \sierra\redbaron
cls
call run
exit