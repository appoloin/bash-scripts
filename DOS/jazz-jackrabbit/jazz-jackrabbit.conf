[midi]
mididevice = mt32


[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off


[autoexec]
mount C -t dir "./" 

@echo off
C: 
goto launcher

:launcher
cls
ECHO  ------------------------------------------ 
ECHO         Jazz Jackrabbit Collection                 
ECHO  ------------------------------------------ 
ECHO   1) Jazz Jackrabbit CD-ROM version         
ECHO   2) Jazz Jackrabbit Holiday Hare 95       
ECHO  ------------------------------------------ 
ECHO   3) Sound and Language Settings            
ECHO  ------------------------------------------ 
ECHO   4) Exit program                           
ECHO  ------------------------------------------ 
choice /c1234 /s Which game do you want to run? [1-4]: /n 

if errorlevel 4 goto exit
if errorlevel 3 goto setup
if errorlevel 2 goto hh95
if errorlevel 1 goto jazz


:jazz
cls
jazz.exe
goto exit


:hh95
cls
cd hh95
jazz.exe
goto exit


:setup
cls
setup.exe
goto launcher


:exit
exit
