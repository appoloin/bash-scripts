[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[sdl]
fullscreen=true
output=opengl


[render]
viewport = fit
integer_scaling = off


[autoexec]
mount C -t dir "./"
mount d  -t cdrom"./CD"  -label SHADOWCD 

d:
ECHO off
goto launcher



:launcher
cls
ECHO ----------------------------------------------
ECHO - ------------------------------------------ -
ECHO -  Shadow of the Comet Launcher              -
ECHO - ------------------------------------------ -
ECHO -  1) Shadow of the Comet                    -
ECHO -  2) Museum                                 -
ECHO - ------------------------------------------ -
ECHO -  3) Game DOS Settings                      -
ECHO - ------------------------------------------ -
ECHO -  4) exit program                           -
ECHO - ------------------------------------------ -
ECHO ----------------------------------------------

choice /c1234 /s Which program do you want to run? [1-4]: /n 
if errorlevel 4 goto exit
if errorlevel 3 goto setup
if errorlevel 2 goto museum
if errorlevel 1 goto game

:game
cls
shadow.exe
goto exit

:setup
cls
install.exe
goto launcher

:museum
cls
museum.exe
goto launcher

:exit
exit