[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[dosbox]
machine	= svga_s3
memsize	= 63
vmemsize = 1

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off

[autoexec]

mount C "./worms" -t dir
imgmount D "./WORMS.DAT" -t iso

C:

call worms

exit