[midi]
mididevice = mt32


[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on


[mouse]
mouse_capture = onstart   
mouse_middle_release=true   
mouse_sensitivity= 50

[gus]
gus=true

[sdl]   
fullresolution=desktop
windowresolution=original
fullscreen=true
output=opengl

[render]
aspect=true
scaler=normal2x


[autoexec]
mount c -t dir "./"
mount A -t floppy "./drive_a" 

c:

cls

cd  tmnt 

autotype -w 0.5 -p 0.3 down down right down enter

play

exit