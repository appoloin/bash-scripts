[midi]
mididevice = mt32

[cpu]
cpu_cycles = 25000
cpu_cycles_protected = auto
cputype = 486
cpu_throttle = on

[sdl]
fullscreen=true
output=opengl

[render]
viewport = fit
integer_scaling = off


[autoexec]
mount C "./" -t dir
imgmount d "./homm1.gog" -t iso

C: 
ECHO OFF
goto launcher


:launcher
cls
ECHO  ------------------------------------------ 
ECHO   Heroes of Might and Magic Launcher        
ECHO  ------------------------------------------ 
ECHO   1) Heroes of Might and Magic              
ECHO   2) Game DOS Settings                      
ECHO  ------------------------------------------
ECHO   3) Exit program                           
ECHO  ------------------------------------------ 
choice /c123 /s Which program do you want to run? [1-3]: /n 
if errorlevel 3 goto exit
if errorlevel 2 goto setup
if errorlevel 1 goto game


:game
cls
cd HoMM
loadfix -4 heroes.exe
goto exit


:setup
cls
cd HoMM
setup.exe
goto launcher


:exit
exit