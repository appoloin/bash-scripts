[dosbox]
machine  = svga_s3
vmemsize = 4

[sdl]
fullscreen = on
pause_when_inactive = yes

[render]
viewport = fit
integer_scaling = off

[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cpu_throttle = on
cputype = 486

[sblaster]
sbtype = sb16

[gus]
gus = false

[midi]
mpu401     = intelligent
mididevice = fluidsynth


[autoexec]
mount C -t dir "./Jewelsof" 
imgmount D -t iso "./JohnnyMn/cd/DRZ-JNM2.CUE"  "./JohnnyMn/cd/DRZ-JNM1.CUE" 

ECHO OFF

SET PATH=%PATH%;C:\WINDOWS;C:\DOS;Y:\DOS;C:\;c:\jewels;d:\
SET TEMP=C:\WINDOWS\TEMP
c: 
echo off
cd MNEMONIC\engine
cls
echo.
echo Press ctrl-F4 to switch CD's when prompted.
echo.
pause
cls 
win MNEMONIC
exit