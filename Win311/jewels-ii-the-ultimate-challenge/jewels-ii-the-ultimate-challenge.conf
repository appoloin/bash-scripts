[dosbox]
machine  = svga_s3
vmemsize = 4

[sdl]
fullscreen = on
pause_when_inactive = yes

[render]
viewport = fit
integer_scaling = off

[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cpu_throttle = on
cputype = 486

[sblaster]
sbtype = sb16

[gus]
gus = false

[midi]
mpu401     = intelligent
mididevice = fluidsynth


[autoexec]
mount C -t dir "./JewelsII" 
imgmount D -t iso "./JewelsII/cd/CD1.iso"  "./JewelsII/cd/CD2.iso" "./JewelsII/cd/CD3.iso" 

ECHO OFF

SET PATH=%PATH%;C:\WINDOWS;C:\DOS;Y:\DOS;C:\
SET TEMP=C:\WINDOWS\TEMP
c: 
cd programs\H_A\jewelsii
echo off
@cls 
echo.
echo This game spans 3 CD's. To switch discs press Ctrl-F4 when prompted.
echo.
pause
win runexit JEWSII31
exit