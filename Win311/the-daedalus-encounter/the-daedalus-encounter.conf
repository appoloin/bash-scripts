[dosbox]
machine  = svga_s3
vmemsize = 4

[sdl]
fullscreen = on
pause_when_inactive = yes

[render]
viewport = fit
integer_scaling = off

[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cpu_throttle = on
cputype = 486

[sblaster]
sbtype = sb16

[gus]
gus = false

[midi]
mpu401     = intelligent
mididevice = fluidsynth


[autoexec]
mount C -t dir "./TheDaeda" 
imgmount D -t iso "./TheDaeda/cd/cd1.iso" "./TheDaeda/cd/cd2.iso" "./TheDaeda/cd/cd3.iso"

ECHO OFF

SET PATH=%PATH%;C:\WINDOWS;C:\DOS;Y:\DOS;C:\;D:\
SET TEMP=C:\WINDOWS\TEMP

C: 
cd DAEDALUS
echo off
cls 
echo.
echo This game spans 2 CD's. To switch discs press Ctrl-F4 when prompted.
echo.
pause
win runexit DAEDALUS
exit