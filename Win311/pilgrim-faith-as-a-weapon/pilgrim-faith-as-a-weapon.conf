[dosbox]
machine  = svga_s3
vmemsize = 4

[sdl]
fullscreen = on
pause_when_inactive = yes

[render]
viewport = fit
integer_scaling = off

[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cpu_throttle = on
cputype = 486

[sblaster]
sbtype = sb16

[gus]
gus = false

[midi]
mpu401     = intelligent
mididevice = fluidsynth


[autoexec]
mount C -t dir "./Pilgrim-" 
imgmount D -t iso "./Pilgrim-/cd/cd1.cue" "./Pilgrim-/cd/cd2.cue"

ECHO OFF

SET PATH=%PATH%;C:\WINDOWS;C:\DOS;Y:\DOS;C:\;
SET TEMP=C:\WINDOWS\TEMP
c: 
@cd Pilgrim 
@cls
echo.
echo Press Ctrl-F4 to switch Cd's when prompted.
echo.
pause 
@cls
@win runexit pilgrim
exit