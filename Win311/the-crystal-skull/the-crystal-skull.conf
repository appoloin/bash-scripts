[dosbox]
machine  = svga_s3
vmemsize = 4

[sdl]
fullscreen = on
pause_when_inactive = yes

[render]
viewport = fit
integer_scaling = off

[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cpu_throttle = on
cputype = 486

[sblaster]
sbtype = sb16

[gus]
gus = false

[midi]
mpu401     = intelligent
mididevice = fluidsynth


[autoexec]

mount c -t dir "./TheCryst" 
imgmount d -t cdrom  "./TheCryst/cd/CRYSTAL1.iso" "./TheCryst/cd/CRYSTAL2.iso" "./TheCryst/cd/CRYSTAL3.iso" 
c: 
ECHO OFF
path=C:\;z:\;c:\windows\ 
cd maxis\crystal
cls
echo.
echo Press Ctrl-F4 to switch CD's when prompted.
echo. 
pause
cls
win runexit CRYSTAL
exit