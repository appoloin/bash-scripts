[dosbox]
machine  = svga_s3
vmemsize = 4

[sdl]
fullscreen = on
pause_when_inactive = yes

[render]
viewport = fit
integer_scaling = off

[cpu]
cpu_cycles = 50000
cpu_cycles_protected = auto
cpu_throttle = on
cputype = 486

[sblaster]
sbtype = sb16

[gus]
gus = false

[midi]
mpu401     = intelligent
mididevice = fluidsynth


[autoexec]
mount C -t dir "./Pyramid-" 
imgmount D -t iso "./Pyramid-/cd/cd1.cue" "./Pyramid-/cd/cd2.cue"

ECHO OFF

SET PATH=%PATH%;C:\WINDOWS;C:\DOS;Y:\DOS;C:\;c:\mhhi\pyramid\
SET TEMP=C:\WINDOWS\TEMP
c: 
@cd mhhi\Pyramid
@cls
echo.
echo Press Ctrl-F4 to switch CD's when prompted.
echo. 
pause
@cls
@win 
exit
